# Mirrors the equivalent workflow in the superapp repo.
name: Pull Request Secret Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Scan PR commits for secrets
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # Include `unverified` so committed-but-dead secrets (e.g. private keys) still fail the gate
          extra_args: --results=verified,unknown,unverified
