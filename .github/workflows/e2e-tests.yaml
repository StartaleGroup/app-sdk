name: E2E Tests

# Debug artifacts (Playwright traces/videos/screenshots) are treated as
# sensitive build output and are opt-in per PR via the `e2e:debug-artifacts`
# label. Three things to know when using it:
#   * `labeled` is deliberately not in the trigger types below, so adding the
#     label does not start a run — push a commit after labelling. A re-run
#     replays the original event payload and still sees the old labels.
#   * On `workflow_call` from superapp, `github.event` is the CALLER's event,
#     so the label must be on the superapp PR, not on an app-sdk PR.
#   * A trace that records any cookie (e.g. the injected LINE session) trips
#     assert-no-credentials, so that job uploads nothing and fails by design.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      superapp-branch:
        description: 'SuperApp branch to test against (empty = use app.startale.com)'
        required: false
        default: ''
        type: string
    secrets:
      GOOGLE_TEST_EMAIL:
        required: false
      GOOGLE_TEST_PASSWORD:
        required: false
      GOOGLE_TOTP_SECRET:
        required: false
      GOOGLE_SESSION_STATE:
        required: false
      LINE_TEST_EMAIL:
        required: false
      LINE_TEST_PASSWORD:
        required: false
      LINE_SESSION_STATE:
        required: false
      WALLET_SEED:
        required: true
      EOA_LINKED_WALLET_SEED:
        required: true
      SUPERAPP_GITHUB_TOKEN:
        required: false
      APP_ENV_FILE:
        required: false
      NPM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    steps:
      # When called from superapp (workflow_call), checkout app-sdk master.
      # When called from app-sdk PR, checkout the PR branch (default).
      - uses: actions/checkout@v7
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v7
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup
        with:
          build: 'true'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: packages/*/dist/
          retention-days: 1

      - name: Prepare SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/prepare-superapp
        with:
          branch: ${{ inputs.superapp-branch }}
          github-token: ${{ secrets.SUPERAPP_GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Upload SuperApp
        if: inputs.superapp-branch != ''
        uses: actions/upload-artifact@v7
        with:
          name: superapp-ready
          path: /tmp/superapp.tar.gz
          retention-days: 1

  smoke:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v7
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp
        with:
          app-env-content: ${{ secrets.APP_ENV_FILE }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: packages/

      - name: Run smoke tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
          E2E_CAPTURE_ARTIFACTS: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && '1' || '0' }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:smoke

      - name: Assert no credentials in test results
        id: assert-creds
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts')
        uses: ./.github/actions/assert-no-credentials
        with:
          paths: e2e/test-results

      # `always()` alone would ignore a failed assert, so the upload is also
      # conditioned on that step's outcome. `playwright-report/` is not
      # uploaded; see e2e/playwright.config.ts.
      - name: Upload test results
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && steps.assert-creds.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-results
          path: e2e/test-results/
          retention-days: 1

  line:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v7
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup
        with:
          install-chrome: 'true'

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp
        with:
          app-env-content: ${{ secrets.APP_ENV_FILE }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: packages/

      - name: Run LINE OAuth tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
          E2E_CAPTURE_ARTIFACTS: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && '1' || '0' }}
          LINE_TEST_EMAIL: ${{ secrets.LINE_TEST_EMAIL }}
          LINE_TEST_PASSWORD: ${{ secrets.LINE_TEST_PASSWORD }}
          LINE_SESSION_STATE: ${{ secrets.LINE_SESSION_STATE }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:line

      - name: Assert no credentials in test results
        id: assert-creds
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts')
        uses: ./.github/actions/assert-no-credentials
        with:
          paths: e2e/test-results
          secrets: |
            ${{ secrets.LINE_TEST_EMAIL }}
            ${{ secrets.LINE_TEST_PASSWORD }}
            ${{ secrets.LINE_SESSION_STATE }}

      # `always()` alone would ignore a failed assert, so the upload is also
      # conditioned on that step's outcome. `playwright-report/` is not
      # uploaded; see e2e/playwright.config.ts.
      - name: Upload test results
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && steps.assert-creds.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-line-results
          path: e2e/test-results/
          retention-days: 1

  eoa:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v7
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp
        with:
          app-env-content: ${{ secrets.APP_ENV_FILE }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: packages/

      - name: Run EOA tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
          E2E_CAPTURE_ARTIFACTS: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && '1' || '0' }}
          WALLET_SEED: ${{ secrets.WALLET_SEED }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:eoa

      - name: Assert no credentials in test results
        id: assert-creds
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts')
        uses: ./.github/actions/assert-no-credentials
        with:
          paths: e2e/test-results
          secrets: |
            ${{ secrets.WALLET_SEED }}

      # `always()` alone would ignore a failed assert, so the upload is also
      # conditioned on that step's outcome. `playwright-report/` is not
      # uploaded; see e2e/playwright.config.ts.
      - name: Upload test results
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && steps.assert-creds.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-eoa-results
          path: e2e/test-results/
          retention-days: 1

  eoa-required:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v7
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup
        with:
          install-chrome: 'true'

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp
        with:
          app-env-content: ${{ secrets.APP_ENV_FILE }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: packages/

      - name: Run EOA Required tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
          E2E_CAPTURE_ARTIFACTS: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && '1' || '0' }}
          EOA_LINKED_WALLET_SEED: ${{ secrets.EOA_LINKED_WALLET_SEED }}
          LINE_TEST_EMAIL: ${{ secrets.LINE_TEST_EMAIL }}
          LINE_TEST_PASSWORD: ${{ secrets.LINE_TEST_PASSWORD }}
          LINE_SESSION_STATE: ${{ secrets.LINE_SESSION_STATE }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:eoa-required

      - name: Assert no credentials in test results
        id: assert-creds
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts')
        uses: ./.github/actions/assert-no-credentials
        with:
          paths: e2e/test-results
          secrets: |
            ${{ secrets.EOA_LINKED_WALLET_SEED }}
            ${{ secrets.LINE_TEST_EMAIL }}
            ${{ secrets.LINE_TEST_PASSWORD }}
            ${{ secrets.LINE_SESSION_STATE }}

      # `always()` alone would ignore a failed assert, so the upload is also
      # conditioned on that step's outcome. `playwright-report/` is not
      # uploaded; see e2e/playwright.config.ts.
      - name: Upload test results
        if: always() && contains(github.event.pull_request.labels.*.name, 'e2e:debug-artifacts') && steps.assert-creds.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-eoa-required-results
          path: e2e/test-results/
          retention-days: 1
