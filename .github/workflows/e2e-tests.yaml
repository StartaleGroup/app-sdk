name: E2E Tests

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_call:
    inputs:
      superapp-branch:
        description: 'SuperApp branch to test against (empty = use app.startale.com)'
        required: false
        default: ''
        type: string
    secrets:
      GOOGLE_TEST_EMAIL:
        required: false
      GOOGLE_TEST_PASSWORD:
        required: false
      GOOGLE_TOTP_SECRET:
        required: false
      GOOGLE_SESSION_STATE:
        required: false
      LINE_TEST_EMAIL:
        required: false
      LINE_TEST_PASSWORD:
        required: false
      LINE_SESSION_STATE:
        required: false
      CLOUDFLARE_TUNNEL_TOKEN:
        required: false
      PAYMASTER_URL:
        required: false
      PAYMASTER_ID:
        required: false
      WALLET_SEED:
        required: true
      EOA_LINKED_WALLET_SEED:
        required: true
      SUPERAPP_GITHUB_TOKEN:
        required: false
      APP_ENV_FILE:
        required: false
      NPM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    if: >-
      inputs.superapp-branch != '' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-test')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    steps:
      # When called from superapp (workflow_call), checkout app-sdk master.
      # When called from app-sdk PR, checkout the PR branch (default).
      - uses: actions/checkout@v4
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v4
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup
        with:
          build: 'true'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: packages/*/dist/
          retention-days: 1

      - name: Prepare SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/prepare-superapp
        with:
          branch: ${{ inputs.superapp-branch }}
          github-token: ${{ secrets.SUPERAPP_GITHUB_TOKEN }}
          app-env-content: ${{ secrets.APP_ENV_FILE }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Upload SuperApp
        if: inputs.superapp-branch != ''
        uses: actions/upload-artifact@v4
        with:
          name: superapp-ready
          path: /tmp/superapp.tar.gz
          retention-days: 1

  smoke:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v4
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/

      - name: Run smoke tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 1

  line:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    # Named tunnel = one connector per token. Serialize the line job repo-wide
    # so concurrent runs (different PRs) can't register two connectors on the
    # same tunnel (Cloudflare 1016). Queue rather than cancel.
    concurrency:
      group: e2e-line-tunnel
      cancel-in-progress: false
    env:
      LINE_TEST_EMAIL: ${{ secrets.LINE_TEST_EMAIL }}
      LINE_TEST_PASSWORD: ${{ secrets.LINE_TEST_PASSWORD }}
      LINE_SESSION_STATE: ${{ secrets.LINE_SESSION_STATE }}
      # Sponsored wallet_sendCalls. PAYMASTER_* stay server-side (testapp proxy);
      # NEXT_PUBLIC_PAYMASTER_BASE_URL is the public tunnel host the prod superapp
      # fetches to reach the testapp paymaster proxy. Required — the sponsored
      # test fails (does not skip) if it is missing.
      PAYMASTER_URL: ${{ secrets.PAYMASTER_URL }}
      PAYMASTER_ID: ${{ secrets.PAYMASTER_ID }}
      NEXT_PUBLIC_PAYMASTER_BASE_URL: ${{ vars.PAYMASTER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v4
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup
        with:
          install-chrome: 'true'

      # Expose the testapp's same-origin paymaster proxy (localhost:3001) on a
      # public hostname so the prod superapp can reach it for sponsored calls.
      # The SCS key stays server-side in the testapp route — only the public
      # host is exposed. Readiness is the connector /ready endpoint (the testapp
      # is started later by Playwright's webServer).
      - name: Start Cloudflare tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared tunnel --no-autoupdate --metrics 127.0.0.1:4040 \
            run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
          echo "Waiting for tunnel connector to register..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4040/ready >/dev/null 2>&1; then
              echo "tunnel ready"; exit 0
            fi
            sleep 2
          done
          echo "tunnel did not become ready" >&2; exit 1

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/

      - name: Run LINE OAuth tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:line

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-line-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 1

  eoa:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    env:
      WALLET_SEED: ${{ secrets.WALLET_SEED }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v4
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/

      - name: Run EOA tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:eoa

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-eoa-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 1

  eoa-required:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    env:
      EOA_LINKED_WALLET_SEED: ${{ secrets.EOA_LINKED_WALLET_SEED }}
      LINE_TEST_EMAIL: ${{ secrets.LINE_TEST_EMAIL }}
      LINE_TEST_PASSWORD: ${{ secrets.LINE_TEST_PASSWORD }}
      LINE_SESSION_STATE: ${{ secrets.LINE_SESSION_STATE }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.superapp-branch != ''
        with:
          repository: StartaleGroup/app-sdk

      - uses: actions/checkout@v4
        if: inputs.superapp-branch == ''

      - uses: ./.github/actions/e2e-setup
        with:
          install-chrome: 'true'

      - name: Start SuperApp
        if: inputs.superapp-branch != ''
        uses: ./.github/actions/start-superapp

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/

      - name: Run EOA Required tests
        env:
          SCW_URL: ${{ inputs.superapp-branch != '' && 'http://localhost:3000/' || '' }}
        run: |
          cd e2e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:ci:eoa-required

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-eoa-required-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 1
