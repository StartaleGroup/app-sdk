name: Renovate

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (no PRs created)"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        default: "info"
        options: [debug, info, warn, error]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.STARTALEAPP_FRONTEND_RENOVATE_APP_ID }}
          private-key: ${{ secrets.STARTALEAPP_FRONTEND_RENOVATE_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write
          permission-administration: read
          permission-members: read
          permission-metadata: read
          permission-vulnerability-alerts: read
      - uses: renovatebot/github-action@v46.2.5
        env:
          LOG_LEVEL: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.logLevel) || 'info' }}
          RENOVATE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun == 'true') && 'full' || 'null' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: '["StartaleGroup/app-sdk"]'
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json
