name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm build:packages

      # Typecheck note: `pnpm --filter sdk-playground typecheck` currently
      # fails on ~9 pre-existing errors in unrelated pages (dashboard,
      # userops, import-sub-account). Re-add typecheck here once that debt
      # is paid down; don't block PRs on it today.

      # Scope note: the full testapp suite currently has 2 pre-existing
      # failures in src/context/EIP1193ProviderContextProvider.test.tsx
      # (SDK init-config drift, unrelated to the playground). Until that is
      # fixed, CI runs the pay-playground suites — including the
      # codeSanitizer security regression tests — so this workflow stays
      # green. Broaden to plain `test:unit` (no path filter) afterwards.
      - name: Unit tests (sdk-playground — pay-playground suites)
        run: pnpm --filter sdk-playground test:unit src/pages/pay-playground
