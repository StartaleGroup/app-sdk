name: Prepare SuperApp
description: Clone and install SuperApp dependencies for E2E testing. Upload as artifact for reuse across jobs.

inputs:
  branch:
    description: SuperApp branch to checkout
    required: true
  github-token:
    description: GitHub token with read access to the SuperApp repo
    required: true
  npm-token:
    description: NPM token for private packages
    required: true

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        missing=()
        [ -z "$GH_TOKEN" ] && missing+=("github-token")
        [ -z "$NPM_TOKEN" ] && missing+=("npm-token")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing required inputs: ${missing[*]}"
          exit 1
        fi

    - name: Clone SuperApp
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SUPERAPP_BRANCH: ${{ inputs.branch }}
      run: |
        git clone --depth 1 --branch "${SUPERAPP_BRANCH}" \
          "https://x-access-token:${GH_TOKEN}@github.com/StartaleGroup/superapp.git" \
          /tmp/superapp

    - name: Setup Node.js for SuperApp
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Setup pnpm for SuperApp
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install SuperApp dependencies
      shell: bash
      working-directory: /tmp/superapp
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        # Remove the credential on any exit path, so a failed install cannot
        # leave an authenticated .npmrc behind for the tarball step.
        trap 'rm -f /tmp/superapp/.npmrc' EXIT
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        pnpm install --frozen-lockfile

    - name: Create SuperApp tarball
      shell: bash
      run: |
        # Tar preserves symlinks (critical for pnpm node_modules structure).
        # .env is intentionally excluded so no secrets land in the uploaded
        # artifact; start-superapp regenerates it from secrets at runtime.
        # GNU tar matches --exclude without FNM_PATHNAME, so `*` spans `/`
        # and these cover every depth. `.git` is load-bearing: the clone URL
        # above persists the GitHub token into .git/config.
        tar czf /tmp/superapp.tar.gz -C /tmp \
          --exclude='superapp/.git' \
          --exclude='superapp/.npmrc' \
          --exclude='superapp/*/.npmrc' \
          --exclude='*/.env' \
          --exclude='*/.env.*' \
          superapp
        echo "Tarball size: $(du -h /tmp/superapp.tar.gz | cut -f1)"

    - name: Assert no credentials in tarball
      shell: bash
      run: |
        # Artifact contents are not masked the way job logs are, so fail
        # loudly rather than publish an archive with a credential in it.
        leaked=$(tar tzf /tmp/superapp.tar.gz \
          | grep -E '(^|/)(\.env(\..*)?|\.npmrc)$' || true)
        if [ -n "$leaked" ]; then
          echo "::error::Credential-bearing files found in superapp tarball:"
          echo "$leaked"
          exit 1
        fi
        echo "Tarball contains no .env / .npmrc entries."
