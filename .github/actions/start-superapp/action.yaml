name: Start SuperApp
description: Download SuperApp artifact, extract it, and start dev server on localhost:3000 for E2E testing.

inputs:
  app-env-content:
    description: Content of the SuperApp .env file
    required: true
  npm-token:
    description: NPM token for private packages
    required: true

runs:
  using: composite
  steps:
    - name: Download SuperApp artifact
      uses: actions/download-artifact@v8
      with:
        name: superapp-ready
        path: /tmp/

    - name: Extract SuperApp
      shell: bash
      run: tar xzf /tmp/superapp.tar.gz -C /tmp

    - name: Create SuperApp .env
      shell: bash
      env:
        APP_ENV_CONTENT: ${{ inputs.app-env-content }}
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        if [ -z "$APP_ENV_CONTENT" ]; then
          echo "::error::Missing required input: app-env-content"
          exit 1
        fi
        printf '%s\n' "$APP_ENV_CONTENT" > /tmp/superapp/app/.env
        echo "NPM_TOKEN=${NPM_TOKEN}" >> /tmp/superapp/app/.env
        echo ".env created ($(wc -l < /tmp/superapp/app/.env) lines)"

    - name: Start SuperApp dev server
      shell: bash
      working-directory: /tmp/superapp
      run: |
        nohup pnpm --filter @startale/superapp dev > /tmp/superapp-server.log 2>&1 &
        echo $! > /tmp/superapp-server.pid
        echo "SuperApp server PID: $(cat /tmp/superapp-server.pid)"

        # Wait for server to be ready (up to 120s)
        for i in $(seq 1 60); do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
          if echo "$HTTP_CODE" | grep -qE "200|302"; then
            echo "SuperApp is ready (attempt $i, HTTP $HTTP_CODE)"
            exit 0
          fi
          echo "Waiting for SuperApp... (attempt $i/60, HTTP $HTTP_CODE)"
          sleep 2
        done

        echo "::error::SuperApp failed to start within 120s"
        echo "--- Server logs ---"
        cat /tmp/superapp-server.log
        exit 1
